[project]
name = "vital-api"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "langchain>=1.0",
  "langchain-openai>=1.0",
  "langfuse>=3.0",
  "langgraph>=1.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.18",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vital_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls OpenRouter and Jev"]
addopts = "-m 'not live'"
